services:
  web:
    build: .
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    restart: unless-stopped
    container_name: gflux-web
    networks:
      - caddy-net
      - monitoring

volumes:
  caddy_data:

networks:
  caddy-net:
    name: caddy-net
  monitoring:
    external: true